spring.application.name=learningtracker

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/learningtracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.learningtracker=${APP_LOG_LEVEL:INFO}

# JWT Configuration
jwt.secret=${JWT_SECRET:local-development-secret-change-me-123456789}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

app.registration.allow-privileged-role=${ALLOW_PRIVILEGED_REGISTRATION:false}
app.demo.seed=${APP_SEED_DEMO:false}
app.demo.admin-username=${APP_ADMIN_USERNAME:}
app.demo.admin-password=${APP_ADMIN_PASSWORD:}

# Upload size limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB




